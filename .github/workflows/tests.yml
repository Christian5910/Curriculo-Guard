# CI (integração contínua): o GitHub roda estes passos sozinho, num computador
# limpo na nuvem, a cada vez que você envia código. Se algo quebrar, o commit
# ganha um X vermelho; se tudo passar, um check verde.
#
# Este arquivo precisa ficar exatamente em .github/workflows/ para o GitHub encontrá-lo.
name: Testes

# QUANDO roda:
on:
  push:                          # a cada push...
    branches: [main, master]     # ...nestas branches
  pull_request:                  # a cada pull request
  workflow_dispatch:             # e manualmente, pelo botão "Run workflow" na aba Actions

# Permissões mínimas: o workflow só precisa LER o código do repositório.
permissions:
  contents: read

jobs:
  testes:
    name: Python ${{ matrix.python }} em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # MATRIZ: o mesmo job roda uma vez para cada combinação abaixo (2 sistemas x 3 versões = 6).
    # É assim que se descobre que algo funciona no Linux e quebra no Windows.
    strategy:
      fail-fast: false           # se uma combinação falhar, as outras continuam e você vê todas
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']   # 3.11 é o mínimo declarado no README

    env:
      PYTHONUTF8: '1'            # saída em UTF-8 também no console do Windows

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip                              # reaproveita downloads entre execuções
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # A interface (Tkinter) precisa de uma tela. Em servidores Linux não há tela, então
      # o Xvfb cria uma "tela virtual". O Windows do GitHub já tem uma sessão gráfica.
      - name: Instalar Xvfb (tela virtual, só no Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Análise estática (imports sem uso, nomes indefinidos)
        run: python -m pyflakes app.py curriculo_guard tests assets evaluation

      # REQUIRE_GUI_TESTS=1 faz o teste da interface FALHAR (em vez de ser ignorado) se
      # não houver Tkinter ou tela: assim ele nunca "passa" sem ter realmente rodado.
      - name: Testes automatizados (Linux, com tela virtual)
        if: runner.os == 'Linux'
        env:
          REQUIRE_GUI_TESTS: '1'
        run: xvfb-run -a python -m unittest discover -s tests -t . -v

      # No Windows os testes de interface rodam se o Tk abrir uma janela; senão são ignorados.
      - name: Testes automatizados (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -v

      # Estes scripts reproduzem os números citados no README. Com --check, saem
      # com erro se a qualidade cair abaixo do que foi medido (regressão).
      - name: Avaliação de frases (recall e falsos positivos)
        run: python -m evaluation.run_phrases --check

      - name: Avaliação em PDFs (ataques e currículos legítimos)
        run: python -m evaluation.run_pdfs --check

      - name: Avaliação com PDFs de outro produtor (reportlab)
        run: python -m evaluation.run_realistic --check

      # Oráculo de renderizadores e extratores independentes: usa pdfium (pypdfium2) e, se existirem no
      # runner, poppler e pdftotext. Ferramentas ausentes são ignoradas.
      - name: Avaliação com renderizadores e extratores independentes
        run: python -m evaluation.run_renderers --check

  # Monta o executável portátil NUM WINDOWS DE VERDADE e confere que ele funciona. É a verificação que
  # não dá para fazer a partir do Linux. Detalhes em EXE/LEIA-ME.md.
  portatil-windows:
    name: Executável portátil (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Montar a pasta portátil (sem o instalador)
        run: python EXE/construcao/construir.py --sem-instalador

      # Usa o Python EMBUTIDO na pasta, não o do runner: é o que o usuário final executará.
      - name: Autoteste com o Python embutido
        run: EXE\CurriculoGuard-Portatil\runtime\python.exe EXE\construcao\verificar_portatil.py

      - name: Abrir o CurriculoGuard.exe e conferir que a janela sobe
        shell: pwsh
        run: |
          Start-Process -FilePath "EXE\CurriculoGuard-Portatil\CurriculoGuard.exe"
          Start-Sleep -Seconds 20
          $programa = Get-Process pythonw -ErrorAction SilentlyContinue
          if (-not $programa) { throw "O CurriculoGuard.exe não abriu o programa (pythonw.exe não está rodando)." }
          Write-Host "Programa em execução (pythonw.exe, PID $($programa.Id))."
          $programa | Stop-Process -Force

