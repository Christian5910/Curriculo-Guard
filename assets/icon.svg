<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Currículo Guard</title>
  <defs>
    <clipPath id="avatar"><circle cx="190" cy="168" r="30"/></clipPath>
  </defs>

  <!-- fundo: quadrado arredondado -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#1B4B86"/>
