  <path d="M496 180 V392 A104 104 0 0 1 392 496 H180 Z" fill="#0B2547" fill-opacity="0.35"/>

  <!-- folha do currículo, com canto dobrado -->
  <path d="M132 92 H292 L362 162 V382 a22 22 0 0 1 -22 22 H132 a22 22 0 0 1 -22 -22 V114 a22 22 0 0 1 22 -22 Z" fill="#FFFFFF"/>
  <path d="M292 92 L362 162 H314 a22 22 0 0 1 -22 -22 Z" fill="#C4D5EC"/>

  <!-- avatar -->
  <circle cx="190" cy="168" r="30" fill="#3B78C4"/>
  <g clip-path="url(#avatar)">
    <circle cx="190" cy="160" r="11" fill="#FFFFFF"/>
    <ellipse cx="190" cy="198" rx="24" ry="19" fill="#FFFFFF"/>
  </g>

  <!-- nome e linhas de texto -->
  <rect x="236" y="150" width="86" height="16" rx="8" fill="#23446F"/>
  <rect x="236" y="176" width="58" height="12" rx="6" fill="#9DB6D8"/>
  <rect x="140" y="234" width="188" height="14" rx="7" fill="#9DB6D8"/>
  <rect x="140" y="264" width="150" height="14" rx="7" fill="#9DB6D8"/>
  <rect x="140" y="294" width="188" height="14" rx="7" fill="#9DB6D8"/>
  <rect x="140" y="324" width="104" height="14" rx="7" fill="#9DB6D8"/>

  <!-- escudo com check -->
  <path d="M360 244 L444 276 V352 C444 410 405 448 360 470 C315 448 276 410 276 352 V276 Z"
        fill="#14B88A" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
  <path d="M360 244 L276 276 V352 C276 410 315 448 360 470 Z" fill="#FFFFFF" fill-opacity="0.16"/>
  <path d="M360 244 L444 276 V352 C444 410 405 448 360 470 Z" fill="#06543F" fill-opacity="0.22"/>
  <path d="M360 244 L444 276 V352 C444 410 405 448 360 470 C315 448 276 410 276 352 V276 Z" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
